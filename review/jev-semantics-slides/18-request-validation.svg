<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".10"/></filter>
<marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2D5BFF"/></marker>
<marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#087E8B"/></marker>
<marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#F59E0B"/></marker>
</defs>
<rect width="1600" height="900" fill="#F6F3EA"/>
<rect x="0" y="0" width="18" height="900" fill="#087E8B"/>
<text x="70" y="48" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#087E8B" text-anchor="start" letter-spacing="2">JEVPILOT · STRUCTURED DRIVING STATE</text>
<text x="70" y="84" font-family="Noto Sans CJK SC" font-size="40" font-weight="800" fill="#16202A" text-anchor="start" letter-spacing="0">进入 Jev 前：候选资格与请求结构双重校验</text>
<line x1="70" y1="145" x2="1530" y2="145" stroke="#D9D5CA" stroke-width="2" stroke-linecap="round" opacity="1"/>
<rect x="70" y="190" width="690" height="590" rx="28" fill="#E7F5F4" fill-opacity="1" stroke="#B8DEDA" stroke-width="3" filter="url(#shadow)"/>
<text x="415" y="240" font-family="Noto Sans CJK SC" font-size="27" font-weight="900" fill="#087E8B" text-anchor="middle" letter-spacing="0">A · 本地候选资格</text>
<rect x="105" y="274" width="105" height="42" rx="21" fill="#087E8B" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="157.5" y="302" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">运动</text>
<text x="230" y="305" font-family="Noto Sans CJK SC" font-size="19" font-weight="560" fill="#16202A" text-anchor="start" letter-spacing="0">速度非 0；脱困时不被阻挡</text>
<rect x="105" y="344" width="105" height="42" rx="21" fill="#087E8B" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="157.5" y="372" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">碰撞</text>
<text x="230" y="375" font-family="Noto Sans CJK SC" font-size="19" font-weight="560" fill="#16202A" text-anchor="start" letter-spacing="0">collision_imminent 必须为 false</text>
<rect x="105" y="414" width="105" height="42" rx="21" fill="#087E8B" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="157.5" y="442" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">道路</text>
<text x="230" y="445" font-family="Noto Sans CJK SC" font-size="19" font-weight="560" fill="#16202A" text-anchor="start" letter-spacing="0">正常模式要求 on_road</text>
<rect x="105" y="484" width="105" height="42" rx="21" fill="#087E8B" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="157.5" y="512" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">方向</text>
<text x="230" y="515" font-family="Noto Sans CJK SC" font-size="19" font-weight="560" fill="#16202A" text-anchor="start" letter-spacing="0">前进阶段要求 follows_route_direction</text>
<rect x="105" y="554" width="105" height="42" rx="21" fill="#087E8B" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="157.5" y="582" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">排队</text>
<text x="230" y="585" font-family="Noto Sans CJK SC" font-size="19" font-weight="560" fill="#16202A" text-anchor="start" letter-spacing="0">队列场景要求 queue_compatible</text>
<rect x="105" y="624" width="105" height="42" rx="21" fill="#F59E0B" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="157.5" y="652" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">停车</text>
<text x="230" y="655" font-family="Noto Sans CJK SC" font-size="19" font-weight="560" fill="#16202A" text-anchor="start" letter-spacing="0">仅在近阻挡/停车线/终点/无可行移动时加入</text>
<rect x="840" y="190" width="690" height="590" rx="28" fill="#EFF3FF" fill-opacity="1" stroke="#C7D2FF" stroke-width="3" filter="url(#shadow)"/>
<text x="1185" y="240" font-family="Noto Sans Mono CJK SC" font-size="27" font-weight="900" fill="#2D5BFF" text-anchor="middle" letter-spacing="0">B · server.validState()</text>
<rect x="875" y="274" width="105" height="42" rx="21" fill="#2D5BFF" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="927.5" y="302" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">批次</text>
<text x="1000" y="305" font-family="Noto Sans CJK SC" font-size="19" font-weight="560" fill="#16202A" text-anchor="start" letter-spacing="0">batch_id = b数字；候选 ID 属于该批次</text>
<rect x="875" y="344" width="105" height="42" rx="21" fill="#2D5BFF" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="927.5" y="372" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">数量</text>
<text x="1000" y="375" font-family="Noto Sans CJK SC" font-size="19" font-weight="560" fill="#16202A" text-anchor="start" letter-spacing="0">candidate 数量 1…12</text>
<rect x="875" y="414" width="105" height="42" rx="21" fill="#2D5BFF" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="927.5" y="442" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">数值</text>
<text x="1000" y="445" font-family="Noto Sans CJK SC" font-size="19" font-weight="560" fill="#16202A" text-anchor="start" letter-spacing="0">字段必须有限；不能出现 NaN/Infinity</text>
<rect x="875" y="484" width="105" height="42" rx="21" fill="#2D5BFF" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="927.5" y="512" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">物理范围</text>
<text x="1000" y="515" font-family="Noto Sans CJK SC" font-size="19" font-weight="560" fill="#16202A" text-anchor="start" letter-spacing="0">steering ≤ 0.85；lane offset ≤ 1.4</text>
<rect x="875" y="554" width="105" height="42" rx="21" fill="#2D5BFF" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="927.5" y="582" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">速度</text>
<text x="1000" y="585" font-family="Noto Sans CJK SC" font-size="19" font-weight="560" fill="#16202A" text-anchor="start" letter-spacing="0">正常 ≥ 0；脱困 ≥ −2；均不超 ceiling</text>
<rect x="875" y="624" width="105" height="42" rx="21" fill="#E45756" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="927.5" y="652" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">停车项</text>
<text x="1000" y="655" font-family="Noto Sans CJK SC" font-size="19" font-weight="560" fill="#16202A" text-anchor="start" letter-spacing="0">需要停车时必须存在固定停车 profile</text>
<line x1="760" y1="485" x2="830" y2="485" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" opacity="1" marker-end="url(#arrow-orange)"/>
<text x="795" y="452" font-family="Noto Sans CJK SC" font-size="17" font-weight="850" fill="#F59E0B" text-anchor="middle" letter-spacing="0">HTTP</text>
<text x="70" y="866" font-family="Noto Sans CJK SC" font-size="14" font-weight="400" fill="#5D6873" text-anchor="start" letter-spacing="0">src/planning.js candidateChoices() · server/jev.js validState()</text>
<text x="1530" y="866" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#5D6873" text-anchor="end" letter-spacing="0">18</text>
