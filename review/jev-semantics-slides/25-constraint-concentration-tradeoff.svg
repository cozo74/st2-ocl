<text x="1050" y="315" font-family="Noto Sans CJK SC" font-size="19" font-weight="540" fill="#5D6873" text-anchor="start" letter-spacing="0">属性产生与消费位置分离</text>
<circle cx="880" cy="381" r="14" fill="#E45756" fill-opacity="1" stroke="none" stroke-width="1"/>
