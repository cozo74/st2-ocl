<rect x="215" y="775" width="1170" height="55" rx="20" fill="#FFF4DF" fill-opacity="1" stroke="#F2D39A" stroke-width="2"/>
<text x="800" y="811" font-family="Noto Sans CJK SC" font-size="22" font-weight="850" fill="#F59E0B" text-anchor="middle" letter-spacing="0">应集中“规则定义与解释”，而不是把所有算法塞进同一个大文件。</text>
<text x="70" y="866" font-family="Noto Sans CJK SC" font-size="14" font-weight="400" fill="#5D6873" text-anchor="start" letter-spacing="0">Architecture assessment: layered enforcement is useful; policy and contracts need consolidation</text>
<text x="1530" y="866" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#5D6873" text-anchor="end" letter-spacing="0">25</text>
