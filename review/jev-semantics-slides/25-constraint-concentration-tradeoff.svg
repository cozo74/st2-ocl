<text x="1050" y="388" font-family="Noto Sans CJK SC" font-size="19" font-weight="540" fill="#5D6873" text-anchor="start" letter-spacing="0">碰撞与速度在多处重新表达</text>
<circle cx="880" cy="454" r="14" fill="#E45756" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="880" y="461" font-family="Noto Sans CJK SC" font-size="17" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">!</text>
<text x="915" y="461" font-family="Noto Sans CJK SC" font-size="20" font-weight="800" fill="#16202A" text-anchor="start" letter-spacing="0">契约隐式</text>
<text x="1050" y="461" font-family="Noto Sans CJK SC" font-size="19" font-weight="540" fill="#5D6873" text-anchor="start" letter-spacing="0">普通 JS 对象，无统一 schema</text>
<circle cx="880" cy="527" r="14" fill="#E45756" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="880" y="534" font-family="Noto Sans CJK SC" font-size="17" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">!</text>
<text x="915" y="534" font-family="Noto Sans CJK SC" font-size="20" font-weight="800" fill="#16202A" text-anchor="start" letter-spacing="0">原因不透明</text>
<text x="1050" y="534" font-family="Noto Sans CJK SC" font-size="19" font-weight="540" fill="#5D6873" text-anchor="start" letter-spacing="0">只能看到 false，看不到为何失败</text>
<circle cx="880" cy="600" r="14" fill="#E45756" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="880" y="607" font-family="Noto Sans CJK SC" font-size="17" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">!</text>
<text x="915" y="607" font-family="Noto Sans CJK SC" font-size="20" font-weight="800" fill="#16202A" text-anchor="start" letter-spacing="0">联动修改</text>
