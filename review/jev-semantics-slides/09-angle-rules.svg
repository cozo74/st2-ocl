<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".10"/></filter>
<marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2D5BFF"/></marker>
<marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#087E8B"/></marker>
<marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#F59E0B"/></marker>
</defs>
<rect width="1600" height="900" fill="#F6F3EA"/>
<rect x="0" y="0" width="18" height="900" fill="#087E8B"/>
<text x="70" y="48" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#087E8B" text-anchor="start" letter-spacing="2">JEVPILOT · STRUCTURED DRIVING STATE</text>
<text x="70" y="84" font-family="Noto Sans CJK SC" font-size="40" font-weight="800" fill="#16202A" text-anchor="start" letter-spacing="0">角度规则：航向、相对航向与转向</text>
<line x1="70" y1="145" x2="1530" y2="145" stroke="#D9D5CA" stroke-width="2" stroke-linecap="round" opacity="1"/>
<circle cx="410" cy="485" r="235" fill="#EDF4F3" fill-opacity="1" stroke="#BFD8D5" stroke-width="3"/>
<line x1="410" y1="485" x2="410" y2="270" stroke="#087E8B" stroke-width="4" stroke-linecap="round" opacity="1" marker-end="url(#arrow-teal)"/>
<line x1="410" y1="485" x2="625" y2="485" stroke="#2D5BFF" stroke-width="4" stroke-linecap="round" opacity="1" marker-end="url(#arrow-blue)"/>
<line x1="410" y1="485" x2="410" y2="700" stroke="#E45756" stroke-width="4" stroke-linecap="round" opacity="1" marker-end="url(#arrow-orange)"/>
<line x1="410" y1="485" x2="195" y2="485" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" opacity="1"/>
<g transform="translate(410 485) rotate(0) scale(0.65)">
<rect x="-32" y="-60" width="64" height="120" rx="22" fill="#2D5BFF" stroke="#FFFFFF" stroke-width="4"/>
<path d="M-23,-18 L-18,-42 L18,-42 L23,-18 Z" fill="#DCEEFF" opacity=".85"/>
<path d="M-16,48 L0,60 L16,48" fill="#FFFFFF" opacity=".9"/>
</g>
<text x="410" y="230" font-family="Noto Sans CJK SC" font-size="23" font-weight="800" fill="#087E8B" text-anchor="middle" letter-spacing="0">0° 北</text>
<text x="685" y="493" font-family="Noto Sans CJK SC" font-size="23" font-weight="800" fill="#2D5BFF" text-anchor="start" letter-spacing="0">+90° 东</text>
<text x="410" y="762" font-family="Noto Sans CJK SC" font-size="23" font-weight="800" fill="#E45756" text-anchor="middle" letter-spacing="0">±180° 南</text>
<text x="130" y="493" font-family="Noto Sans CJK SC" font-size="23" font-weight="800" fill="#F59E0B" text-anchor="end" letter-spacing="0">−90° 西</text>
<rect x="760" y="190" width="770" height="175" rx="24" fill="#FFFFFF" fill-opacity="1" stroke="#DDD7CC" stroke-width="2"/>
<text x="800" y="238" font-family="Noto Sans CJK SC" font-size="24" font-weight="800" fill="#087E8B" text-anchor="start" letter-spacing="0">航向定义</text>
<text x="800" y="286" font-family="Noto Sans Mono CJK SC" font-size="23" font-weight="700" fill="#16202A" text-anchor="start" letter-spacing="0">heading(a,b) = atan2(Δx, −Δz)</text>
<text x="800" y="328" font-family="Noto Sans Mono CJK SC" font-size="20" font-weight="600" fill="#5D6873" text-anchor="start" letter-spacing="0">angle(h) = atan2(sin h, cos h) → [−π, π]</text>
<rect x="760" y="390" width="770" height="175" rx="24" fill="#EFF3FF" fill-opacity="1" stroke="#C7D2FF" stroke-width="2"/>
<text x="800" y="438" font-family="Noto Sans CJK SC" font-size="24" font-weight="800" fill="#2D5BFF" text-anchor="start" letter-spacing="0">相对航向</text>
<text x="800" y="485" font-family="Noto Sans Mono CJK SC" font-size="21" font-weight="650" fill="#16202A" text-anchor="start" letter-spacing="0">heading_relative = other.heading − ego.heading</text>
<text x="800" y="528" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#2D5BFF" text-anchor="start" letter-spacing="0">0° 同向 · ±90° 横穿 · ±180° 对向</text>
<rect x="760" y="590" width="770" height="200" rx="24" fill="#FFF4DF" fill-opacity="1" stroke="#F2D39A" stroke-width="2"/>
<text x="800" y="638" font-family="Noto Sans CJK SC" font-size="24" font-weight="800" fill="#F59E0B" text-anchor="start" letter-spacing="0">转向符号</text>
<text x="800" y="686" font-family="Noto Sans CJK SC" font-size="22" font-weight="650" fill="#16202A" text-anchor="start" letter-spacing="0">positive steering → 右转 → heading 增大</text>
<text x="800" y="728" font-family="Noto Sans CJK SC" font-size="20" font-weight="500" fill="#5D6873" text-anchor="start" letter-spacing="0">负速度倒车时，同一方向盘输入会产生相反航向变化</text>
<text x="70" y="866" font-family="Noto Sans CJK SC" font-size="14" font-weight="400" fill="#5D6873" text-anchor="start" letter-spacing="0">src/math.js heading()/angle() · src/planning.js integratePose()</text>
<text x="1530" y="866" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#5D6873" text-anchor="end" letter-spacing="0">09</text>
</svg>