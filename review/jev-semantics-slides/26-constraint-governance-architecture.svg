<text x="670" y="587" font-family="Noto Sans CJK SC" font-size="20" font-weight="600" fill="#16202A" text-anchor="start" letter-spacing="0">stop / speed policy</text>
<rect x="640" y="660" width="320" height="48" rx="18" fill="#2D5BFF" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="800" y="691" font-family="Noto Sans CJK SC" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">唯一可解释的策略结果</text>
<rect x="1120" y="205" width="410" height="500" rx="28" fill="#FFF4DF" fill-opacity="1" stroke="#F2D39A" stroke-width="3" filter="url(#shadow)"/>
<text x="1325" y="255" font-family="Noto Sans CJK SC" font-size="26" font-weight="900" fill="#F59E0B" text-anchor="middle" letter-spacing="0">③ 独立信任边界</text>
<rect x="1165" y="310" width="320" height="50" rx="15" fill="#FFFFFF" fill-opacity="1" stroke="#F59E0B" stroke-width="2"/>
<text x="1325" y="342" font-family="Noto Sans Mono CJK SC" font-size="18" font-weight="700" fill="#16202A" text-anchor="middle" letter-spacing="0">server.validState</text>
<rect x="1165" y="380" width="320" height="50" rx="15" fill="#FFFFFF" fill-opacity="1" stroke="#F59E0B" stroke-width="2"/>
<text x="1325" y="412" font-family="Noto Sans Mono CJK SC" font-size="18" font-weight="700" fill="#16202A" text-anchor="middle" letter-spacing="0">decisionControls</text>
<rect x="1165" y="450" width="320" height="50" rx="15" fill="#FFFFFF" fill-opacity="1" stroke="#F59E0B" stroke-width="2"/>
<text x="1325" y="482" font-family="Noto Sans Mono CJK SC" font-size="18" font-weight="700" fill="#16202A" text-anchor="middle" letter-spacing="0">generation / expiry</text>
<rect x="1165" y="520" width="320" height="50" rx="15" fill="#FFFFFF" fill-opacity="1" stroke="#F59E0B" stroke-width="2"/>
<text x="1325" y="552" font-family="Noto Sans Mono CJK SC" font-size="18" font-weight="700" fill="#16202A" text-anchor="middle" letter-spacing="0">Simulation.step</text>
<rect x="1165" y="590" width="320" height="50" rx="15" fill="#FFFFFF" fill-opacity="1" stroke="#F59E0B" stroke-width="2"/>
<text x="1325" y="622" font-family="Noto Sans Mono CJK SC" font-size="18" font-weight="700" fill="#16202A" text-anchor="middle" letter-spacing="0">actual collision</text>
<line x1="485" y1="455" x2="585" y2="455" stroke="#087E8B" stroke-width="5" stroke-linecap="round" opacity="1" marker-end="url(#arrow-teal)"/>
<line x1="1010" y1="455" x2="1110" y2="455" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" opacity="1" marker-end="url(#arrow-orange)"/>
<rect x="200" y="775" width="1200" height="58" rx="20" fill="#102D35" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="800" y="812" font-family="Noto Sans CJK SC" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">目标：一处定义约束语义，多处执行纵深防御；每次拒绝都能给出统一原因。</text>
<text x="70" y="866" font-family="Noto Sans CJK SC" font-size="14" font-weight="400" fill="#5D6873" text-anchor="start" letter-spacing="0">Proposed design: shared schema + policy result + stage-specific guards</text>
<text x="1530" y="866" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#5D6873" text-anchor="end" letter-spacing="0">26</text>
</svg>