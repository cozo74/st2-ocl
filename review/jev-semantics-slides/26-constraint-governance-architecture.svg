<text x="670" y="335" font-family="Noto Sans CJK SC" font-size="20" font-weight="600" fill="#16202A" text-anchor="start" letter-spacing="0">共享常量与 candidate schema</text>
<circle cx="645" cy="391" r="8" fill="#2D5BFF" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="670" y="398" font-family="Noto Sans CJK SC" font-size="20" font-weight="600" fill="#16202A" text-anchor="start" letter-spacing="0">evaluateCandidate()</text>
<circle cx="645" cy="454" r="8" fill="#2D5BFF" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="670" y="461" font-family="Noto Sans CJK SC" font-size="20" font-weight="600" fill="#16202A" text-anchor="start" letter-spacing="0">硬失败 / 警告 / penalty</text>
<circle cx="645" cy="517" r="8" fill="#2D5BFF" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="670" y="524" font-family="Noto Sans CJK SC" font-size="20" font-weight="600" fill="#16202A" text-anchor="start" letter-spacing="0">稳定 reason codes</text>
